<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Scaling layout on different monitor sizes. This code forces the page width to match the physical screen size -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>EMarchive</title>
  </head>
  <body>
    <div class="terminal-container">
      <div id="terminal-history">
        <div class="output-line system-msg">Archive for the work of EM v0.0.1</div>

        <!-- Active input row -->
        <div class="input-line">
          <span class="prompt">reader@em:~$</span>
          <input type="text"
                 id="terminal-input"
                 autofocus
                 autocomplete="off"
                 spellcheck="false">
        </div>
      </div>
    </div>
  </body>
</html>
